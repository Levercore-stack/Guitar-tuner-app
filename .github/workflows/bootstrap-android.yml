name: Guitar Tuner Android APK
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Guitar Tuner repository
        uses: actions/checkout@v4
      - name: Expand starter for first run
        shell: bash
        run: |
          set -euo pipefail
          if test -f bootstrap/Guitar_Tuner_Android_Starter_v0.1.zip; then
            mkdir -p "$RUNNER_TEMP/guitar-tuner-source"
            unzip -q bootstrap/Guitar_Tuner_Android_Starter_v0.1.zip -d "$RUNNER_TEMP/guitar-tuner-source"
            cp -a "$RUNNER_TEMP/guitar-tuner-source/guitar-tuner-android-v0.1/." .
            test -f app/src/main/java/com/levercore/guitartuner/domain/PitchEngine.kt
            rm -f .github/workflows/android-apk.yml
            find app docs -type f \( -name '*.kt' -o -name '*.md' -o -name '*.xml' \) -print0 | xargs -0 sed -i -e 's/Lever Tuner/Guitar Tuner/g' -e 's/LEVER TUNER/GUITAR TUNER/g'
            sed -i -e 's/Lever Tuner/Guitar Tuner/g' -e 's/LEVER TUNER/GUITAR TUNER/g' README.md
          else
            test -f app/src/main/java/com/levercore/guitartuner/domain/PitchEngine.kt
          fi
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Guitar Tuner APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify output
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Commit readable native source without workflow-token privilege violation
        shell: bash
        run: |
          set -euo pipefail
          if test -f bootstrap/Guitar_Tuner_Android_Starter_v0.1.zip; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app README.md build.gradle.kts settings.gradle.kts gradle.properties .gitignore docs
            git rm -f bootstrap/Guitar_Tuner_Android_Starter_v0.1.zip
            if ! git diff --cached --quiet; then
              git commit -m "Publish verified Guitar Tuner native source and remove bootstrap archive"
              git push origin HEAD:main
            fi
          fi
      - name: Upload Guitar Tuner APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
